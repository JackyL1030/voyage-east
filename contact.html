<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Travel Destinations</title>
  </head>

  <body>
    <div class="container-fluid">
      <nav
        id="mainNavbar"
        class="navbar navbar-expand-md fixed-top custom-navbar navbar-light"
      >
        <div class="container">
          <a
            href="index.html"
            class="navbar-brand"
            style="color: #e63e5c; font-weight: 700"
          >
            Voyage East
          </a>

          <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a href="index.html" class="nav-link">Home</a>
              </li>
              <li class="nav-item">
                <a href="trip-planner.html" class="nav-link">Trip Planner</a>
              </li>
              <li class="nav-item">
                <a href="contact.html" class="nav-link active">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <div class="container mt-5 pt-5">
        <div class="text-center mb-4">
          <img
            src="https://i.pinimg.com/originals/7b/8d/eb/7b8debff010ec5c138dfb99e2dce5126.gif"
            class="img-fluid rounded-4 fadeInDown-animation"
            style="width: 100%; max-width: 600px"
            alt="airplane-window"
          />
        </div>

        <form>
          <div class="mb-3">
            <label for="firstName" class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Enter name" />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              placeholder="Enter email"
              aria-describedby="emailHelp"
            />
            <div id="emailHelp" class="form-text">
              We'll never share your email with anyone else.
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Feedback / Contact</label>
            <textarea
              class="form-control"
              rows="4"
              placeholder="Tell me what other destinations I should add to my travel list"
            ></textarea>
          </div>
          <button
            type="submit"
            class="btn btn-custom"
            style="margin-bottom: 30px"
          >
            Submit Suggestion
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
